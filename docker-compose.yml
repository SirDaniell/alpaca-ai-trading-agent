version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: alpaca-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alpaca_agent}
      POSTGRES_USER: ${POSTGRES_USER:-alpaca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpaca}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpaca} -d ${POSTGRES_DB:-alpaca_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: alpaca-agent-backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://alpaca:alpaca@postgres:5432/alpaca_agent}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
